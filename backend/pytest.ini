[pytest]
# Pytest 配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 覆盖率配置 (需要安装 pytest-cov)
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    auth: 认证相关测试
    resume: 简历相关测试

# 异步测试
asyncio_mode = auto

# 最小 Python 版本
minversion = 8.0
