name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff mypy bandit[toml]

      - name: Run Ruff linting
        run: cd backend && ruff check app/ --output-format=github
        continue-on-error: true

      - name: Run type checking
        run: cd backend && mypy app/ --ignore-missing-imports
        continue-on-error: true

  # 后端测试
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          pip install -r requirements.txt

      - name: Run tests
        env:
          USE_SQLITE: "True"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "fake://localhost:6379/0"
          CACHE_REDIS_URL: "fake://localhost:6379/1"
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "false"
        run: |
          cd backend
          pytest tests/ -v --tb=short --asyncio-mode=auto -x --ignore=tests/test_wechat_enhanced.py --ignore=tests/test_xiaomi_provider.py --ignore=tests/test_templates_enhanced.py --ignore=tests/test_templates_enhanced2.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          retention-days: 7

  # 前端测试
  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd ai-resume-web && pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Run linting
        run: cd ai-resume-web && pnpm run lint
        continue-on-error: true

      - name: Run type checking
        run: cd ai-resume-web && pnpm run type-check
        continue-on-error: true

      - name: Run tests
        run: cd ai-resume-web && pnpm run test
        continue-on-error: true

      - name: Build production bundle
        run: cd ai-resume-web && pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ai-resume-web/dist/
          retention-days: 7

  # 安全扫描
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

  # 发送通知
  notify:
    name: 发送通知
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    steps:
      - name: Notify via Slack
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            CI/CD Pipeline: ${{ job.status }}
            Backend: ${{ needs.backend-test.result }}
            Frontend: ${{ needs.frontend-test.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Summary
        run: |
          echo "## CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend-test.result }}" >> $GITHUB_STEP_SUMMARY
