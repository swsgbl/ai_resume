services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.lite
    ports:
      - "8000:8000"
    environment:
      - USE_SQLITE=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/ai_resume.db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      # ⚠️ 安全警告：生产环境必须通过 .env 文件或 secrets manager 设置这些值
      # 使用以下命令生成安全密钥：
      # python -c "import secrets; print(secrets.token_urlsafe(32))"
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      # CORS 配置：生产环境应限制为特定域名，不应使用通配符
      # 示例: http://localhost:3000,https://yourdomain.com
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DEFAULT_AI_PROVIDER=xiaomi
      - LOG_LEVEL=INFO
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ai-resume-web/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  backend_data:
  redis_data:
